<!-- @dsCard group="Colors" viewport="700x220" subtitle="Base surfaces, light mode" name="Neutrals: light" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{background:var(--bg);padding:24px;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)}
.row{display:flex;gap:12px}
.sw{flex:1;height:90px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px}
.tx{display:flex;gap:16px;margin-top:16px}
</style></head><body data-theme="light">
<div class="row">
  <div class="sw" style="background:var(--bg)">--bg</div>
  <div class="sw" style="background:var(--bg-raised)">--bg-raised</div>
  <div class="sw" style="background:var(--surface);border:1px solid var(--border)">--surface</div>
  <div class="sw" style="background:var(--surface-hover)">--surface-hover</div>
</div>
<div class="tx">
  <span style="color:var(--text-primary)">Primary text</span>
  <span style="color:var(--text-secondary)">Secondary text</span>
  <span style="color:var(--text-tertiary)">Tertiary text</span>
</div>
</body></html>
