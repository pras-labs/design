<!-- @dsCard group="Components" viewport="700x440" subtitle="Buttons, tags, code block" name="Core primitives" -->
<html><head><link rel="stylesheet" href="../../styles.css"><style>
body{background:var(--bg);padding:24px;color:var(--text-primary)}
.row{display:flex;gap:var(--space-3);align-items:center;margin-bottom:18px;flex-wrap:wrap}
.tags{display:flex;gap:var(--space-3) var(--space-2);margin-bottom:18px;flex-wrap:wrap}
.btn{font-family:var(--font-heading);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;padding:0 18px;min-height:var(--touch-target);align-items:center;font-size:var(--text-sm);text-decoration:none;display:inline-flex}
.btn-primary{background:var(--accent);color:var(--text-on-accent)}
.btn-secondary{background:transparent;color:var(--text-primary);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn[aria-disabled="true"]{background:var(--surface-2);color:var(--text-secondary);border-color:transparent;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;min-height:32px;font-family:var(--font-mono);font-size:var(--text-xs);padding:0 12px;border-radius:var(--radius-full);border:1px solid var(--border-control);color:var(--text-secondary);text-decoration:none}
.tag.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent);font-weight:600}
pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-md);margin:0;padding:16px 18px;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--code-fg);overflow:auto;max-width:100%}
.note{font-family:var(--font-heading);font-size:var(--text-xs);color:var(--text-secondary);margin:0 0 18px}
</style></head><body>
<div class="row">
  <a class="btn btn-primary" href="#">Read the postmortem</a>
  <a class="btn btn-secondary" href="#">Secondary</a>
  <a class="btn btn-ghost" href="#">View source</a>
  <button class="btn btn-primary" type="button" aria-disabled="true">Send</button>
  <button class="btn btn-primary" type="button" aria-disabled="true" aria-busy="true">Sending</button>
</div>
<div class="tags">
  <a class="tag" href="#" data-hit>kubernetes</a>
  <a class="tag active" href="#" data-hit aria-current="true">gitops</a>
  <a class="tag" href="#" data-hit>networking</a>
  <a class="tag" href="#" data-hit>platform-engineering</a>
</div>
<pre tabindex="0" role="region" aria-label="apply.sh"><span class="tok-comment"># apply.sh (sample)</span>
kubectl <span class="tok-tag">--context</span>=prod-apse1 apply -f <span class="tok-string">./manifests</span> --replicas=<span class="tok-number">3</span></pre>
<p class="note" style="margin-top:12px">Sample text for layout only.</p>
</body></html>
